<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maks Gorin — Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --ink:#0b0c0f;
    --paper:#ece9e2;
    --paper-dim: rgba(236,233,226,0.78);
    --muted: rgba(236,233,226,0.42);
    --line: rgba(236,233,226,0.10);
    --signal:#c9cdd4;
    --signal-ink:#14161b;
    --serif:'Fraunces',serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    overflow-x:hidden;
    height:100%;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- background ---------- */
  .grid-bg{ position:fixed; inset:0; z-index:0; background:var(--ink); }
  .grid-bg .glow{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 62%, rgba(200,205,215,0.14), transparent 55%);
  }
  .grid-bg .dots{
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(236,233,226,0.07) 1px, transparent 1px);
    background-size: 25px 25px;
  }
  .grid-bg .glow{ animation: glowPulse 11s ease-in-out infinite alternate; }
  @keyframes glowPulse{
    from{ opacity:0.75; transform:scale(1); }
    to{ opacity:1; transform:scale(1.06); }
  }
  .grid-bg .dust{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0.85;
  }
  .grid-bg .vignette{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0,0,0,0.65) 100%);
  }

  /* ---------- layout ---------- */
  .page{ position:relative; z-index:1; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  header{ text-align:center; padding: max(52px, env(safe-area-inset-top) + 36px) 20px 0; }
  .eyebrow{ margin:0; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
  h1{ margin:8px 0 0; font-family:var(--serif); font-weight:600; font-size:clamp(26px,7vw,38px); letter-spacing:-0.01em; color:var(--paper); }
  .hint{ margin:10px 0 0; text-align:center; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }

  /* ---------- chip ---------- */
  .chip{
    width:fit-content; max-width:82vw;
    margin: 18px auto 0;
    display:flex; align-items:center; gap:10px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border:1px solid var(--line);
    border-radius:12px;
    padding: 9px 14px;
    opacity:0; animation: fadeUp 0.6s ease 0.5s forwards;
  }
  .chip-text{ display:flex; flex-direction:column; gap:2px; text-align:left; min-width:0; }
  .chip-eyebrow{ font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); transition:opacity 0.15s ease; white-space:nowrap; }
  .chip-title{ font-family:var(--serif); font-size:14px; color:var(--paper); transition:opacity 0.15s ease; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip i{ color:var(--signal); font-size:11px; flex-shrink:0; }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  /* ---------- deck ---------- */
  .deck-wrap{
    flex:1;
    display:flex; align-items:center;
    overflow-x:auto; overflow-y:visible;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    touch-action:pan-x;
  }
  .deck-wrap::-webkit-scrollbar{ display:none; }
  .deck{
    display:flex; align-items:center;
    gap:22px;
    padding: 30px calc(50% - 62px) 30px;
  }

  .card{
    --card-bg: var(--paper);
    flex-shrink:0;
    width:124px; height:168px;
    border-radius:13px;
    background:var(--card-bg);
    border:1px solid rgba(0,0,0,0.05);
    display:flex; flex-direction:column;
    padding:13px 12px;
    text-decoration:none; color:var(--ink);
    scroll-snap-align:center;
    cursor:pointer;
    position:relative;
    box-shadow:0 16px 32px rgba(0,0,0,0.4);
    transition: background 0.35s ease, box-shadow 0.35s ease;
    will-change:transform;
    opacity:0;
    animation: cardIn 0.6s cubic-bezier(.2,.9,.25,1) forwards;
  }
  .card:nth-child(1){ animation-delay:0.05s; }
  .card:nth-child(2){ animation-delay:0.12s; }
  .card:nth-child(3){ animation-delay:0.19s; }
  .card:nth-child(4){ animation-delay:0.26s; }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(30px);} to{ opacity:1; transform:translateY(0);} }

  .card::before{
    content:''; position:absolute; top:-6px; left:14px;
    width:32px; height:9px; border-radius:5px 5px 0 0;
    background:var(--card-bg);
    transition:background 0.35s ease;
  }
  .card.active{ --card-bg: var(--signal); box-shadow:0 20px 44px rgba(201,205,212,0.28), 0 0 0 1px rgba(201,205,212,0.4); }

  .card .idx{ font-size:9.5px; letter-spacing:0.05em; color:rgba(0,0,0,0.34); }
  .card.active .idx{ color:rgba(6,20,13,0.5); }
  .card .icon{ flex:1; display:flex; align-items:center; justify-content:center; font-size:24px; color:rgba(0,0,0,0.7); }
  .card.active .icon{ color:var(--signal-ink); }
  .card .icon.mono-j{ font-family:var(--serif); font-weight:600; font-size:30px; }
  .card .label{ font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; text-align:center; color:rgba(0,0,0,0.58); }
  .card.active .label{ color:rgba(6,20,13,0.62); }

  /* ---------- modal ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(2,2,6,0.7);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    opacity:0; pointer-events:none; transition:opacity 0.3s ease;
    z-index:9;
  }
  .backdrop.show{ opacity:1; pointer-events:auto; }

  .modal{
    position:fixed; top:50%; left:50%;
    width:min(360px,86vw);
    background:#121317;
    border:1px solid var(--line);
    border-radius:18px;
    padding:38px 26px 30px;
    text-align:center;
    z-index:10;
    opacity:0; pointer-events:none;
    transform:translate(-50%,-50%) scale(0.94);
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .modal.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .modal-close{
    position:absolute; top:12px; right:12px;
    width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid var(--line);
    color:var(--paper); display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer;
  }
  .modal-eyebrow{ margin:0; font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--signal); }
  .modal-quote{ margin:16px 0 0; font-family:var(--serif); font-style:italic; font-size:19px; line-height:1.55; color:var(--paper); transition:opacity 0.18s ease; }
  .modal-by{ margin:16px 0 0; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); transition:opacity 0.18s ease; }
  .modal-tap{ margin:22px 0 0; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }

  a.card:focus-visible, .card:focus-visible, .modal-close:focus-visible{
    outline:2px solid var(--signal); outline-offset:3px;
  }

  /* ---------- responsive ---------- */
  @media (min-width:400px){
    .card{ width:136px; height:182px; }
    .card .icon{ font-size:26px; }
    .card .icon.mono-j{ font-size:32px; }
    .card .label{ font-size:11px; }
    .deck{ gap:26px; padding: 30px calc(50% - 68px) 30px; }
    .chip-title{ font-size:15px; }
  }
  @media (min-width:768px){
    .card{ width:150px; height:200px; }
    .deck{ gap:30px; padding: 30px calc(50% - 75px) 30px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
    .card{ opacity:1; }
    .chip{ opacity:1; }
  }
</style>
<base target="_blank">
<base target="_blank">
</head>
<body>

<div class="grid-bg">
  <div class="glow"></div>
  <div class="dots"></div>
  <canvas class="dust" id="dust" aria-hidden="true"></canvas>
  <div class="vignette"></div>
</div>

<div class="page">
  <header>
    <p class="eyebrow">Montréal — Index</p>
    <h1>Maks Gorin</h1>
    <p class="hint">Swipe to browse · tap to open</p>
  </header>

  <div class="chip" id="chip">
    <div class="chip-text">
      <span class="chip-eyebrow" id="chipEyebrow">Website</span>
      <span class="chip-title" id="chipTitle">januslabsco.com</span>
    </div>
    <i class="fa-solid fa-arrow-right"></i>
  </div>

  <div class="deck-wrap" id="carousel">
    <div class="deck" id="track">

      <a class="card" data-type="link" href="https://januslabsco.com" data-web="https://januslabsco.com" aria-label="Open Janus Labs website">
        <span class="idx">01</span>
        <span class="icon mono-j">J</span>
        <span class="label">Studio</span>
      </a>

      <a class="card" data-type="link"
         href="https://www.youtube.com/@maksgorin2687"
         data-web="https://www.youtube.com/@maksgorin2687"
         data-ios="youtube://www.youtube.com/@maksgorin2687"
         data-android-package="com.google.android.youtube"
         aria-label="Open YouTube channel">
        <span class="idx">02</span>
        <span class="icon"><i class="fa-brands fa-youtube"></i></span>
        <span class="label">YouTube</span>
      </a>

      <a class="card" data-type="link"
         href="https://www.tiktok.com/@maksgorin1"
         data-web="https://www.tiktok.com/@maksgorin1"
         data-android-package="com.zhiliaoapp.musically"
         aria-label="Open TikTok profile">
        <span class="idx">03</span>
        <span class="icon"><i class="fa-brands fa-tiktok"></i></span>
        <span class="label">TikTok</span>
      </a>

      <div class="card" data-type="quotes" id="quoteCard" role="button" tabindex="0" aria-label="Open a quote">
        <span class="idx">04</span>
        <span class="icon"><i class="fa-solid fa-feather"></i></span>
        <span class="label">Quotes</span>
      </div>

    </div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="modal" id="modal">
  <div class="modal-close" id="modalClose" role="button" tabindex="0" aria-label="Close"><i class="fa-solid fa-xmark"></i></div>
  <p class="modal-eyebrow">Quote — tap to cycle</p>
  <p class="modal-quote" id="quoteText"></p>
  <p class="modal-by" id="quoteBy"></p>
  <p class="modal-tap">Tap anywhere to read another</p>
</div>

<script>
(function(){
  var carousel = document.getElementById('carousel');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var chip = document.getElementById('chip');
  var chipEyebrow = document.getElementById('chipEyebrow');
  var chipTitle = document.getElementById('chipTitle');
  var ticking = false;
  var lastActive = -1;

  var chipData = [
    { eyebrow:'Website', title:'januslabsco.com' },
    { eyebrow:'Video', title:'@maksgorin2687' },
    { eyebrow:'Short form', title:'@maksgorin1' },
    { eyebrow:'Wisdom', title:'Tap to read' }
  ];

  function updateChip(idx){
    if (idx === lastActive) return;
    lastActive = idx;
    var d = chipData[idx];
    if (!d) return;
    chipEyebrow.style.opacity = 0; chipTitle.style.opacity = 0;
    setTimeout(function(){
      chipEyebrow.textContent = d.eyebrow;
      chipTitle.textContent = d.title;
      chipEyebrow.style.opacity = 1; chipTitle.style.opacity = 1;
    }, 130);
  }

  function updateDeck(){
    var rect = carousel.getBoundingClientRect();
    var centerX = rect.left + rect.width/2;
    var nearestIdx = 0, nearestAbs = Infinity;

    cards.forEach(function(card, i){
      var cRect = card.getBoundingClientRect();
      var cCenter = cRect.left + cRect.width/2;
      var delta = (cCenter - centerX) / (rect.width/2);
      var clamped = Math.max(-1.4, Math.min(1.4, delta));
      var rotate = clamped * 13;
      var arc = Math.abs(clamped) * 28;
      var scale = 1 - Math.min(Math.abs(clamped),1)*0.22;
      var bright = 1 - Math.min(Math.abs(clamped),1)*0.15;

      card.style.transform = 'rotate('+rotate+'deg) translateY('+arc+'px) scale('+scale+')';
      card.style.zIndex = Math.round((1-Math.abs(clamped))*100);
      card.style.filter = 'brightness('+bright+')';

      if (Math.abs(delta) < nearestAbs){ nearestAbs = Math.abs(delta); nearestIdx = i; }
    });

    cards.forEach(function(card, i){ card.classList.toggle('active', i === nearestIdx); });
    updateChip(nearestIdx);
    ticking = false;
  }

  function onScroll(){
    if (!ticking){ requestAnimationFrame(updateDeck); ticking = true; }
  }
  carousel.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', updateDeck);
  updateDeck();

  // app-first redirect
  var isAndroid = /android/i.test(navigator.userAgent);
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  cards.filter(function(c){ return c.dataset.type === 'link'; }).forEach(function(row){
    row.addEventListener('click', function(e){
      var webUrl = row.getAttribute('data-web');
      var iosScheme = row.getAttribute('data-ios');
      var androidPkg = row.getAttribute('data-android-package');
      if (!iosScheme && !androidPkg){ return; }
      e.preventDefault();
      if (isAndroid && androidPkg){
        var bare = webUrl.replace(/^https?:\/\//,'');
        window.location.href = 'intent://'+bare+'#Intent;scheme=https;package='+androidPkg+';S.browser_fallback_url='+encodeURIComponent(webUrl)+';end';
        return;
      }
      if (isIOS && iosScheme){
        var didHide = false;
        var onHide = function(){ didHide = true; };
        document.addEventListener('visibilitychange', onHide, { once:true });
        window.location.href = iosScheme;
        setTimeout(function(){
          document.removeEventListener('visibilitychange', onHide);
          if (!didHide){ window.location.href = webUrl; }
        }, 900);
        return;
      }
      window.location.href = webUrl;
    });
  });

  // quotes
  var quotes = [
    { q:"You have power over your mind, not outside events.", by:"Marcus Aurelius" },
    { q:"Waste no more time arguing what a good man should be. Be one.", by:"Marcus Aurelius" },
    { q:"It is not that we have a short time to live, but that we waste a lot of it.", by:"Seneca" },
    { q:"It's not what happens to you, but how you react that matters.", by:"Epictetus" },
    { q:"Our greatest glory is not in never falling, but in rising every time we fall.", by:"Confucius" },
    { q:"The man who moves a mountain begins by carrying away small stones.", by:"Confucius" },
    { q:"A journey of a thousand miles begins with a single step.", by:"Lao Tzu" },
    { q:"In the midst of chaos, there is also opportunity.", by:"Sun Tzu" },
    { q:"Whatever you are, be a good one.", by:"Abraham Lincoln" },
    { q:"By failing to prepare, you are preparing to fail.", by:"Benjamin Franklin" },
    { q:"Well done is better than well said.", by:"Benjamin Franklin" },
    { q:"Knowing yourself is the beginning of all wisdom.", by:"Aristotle" },
    { q:"The only true wisdom is in knowing you know nothing.", by:"Socrates" },
    { q:"Simplicity is the ultimate sophistication.", by:"Leonardo da Vinci" },
    { q:"Know thyself.", by:"Ancient Greek maxim" },
    { q:"This too shall pass.", by:"Traditional proverb" },
    { q:"Carpe diem.", by:"Horace" },
    { q:"Fortune favors the bold.", by:"Virgil" },
    { q:"Knowledge is power.", by:"Francis Bacon" },
    { q:"Imagination rules the world.", by:"Napoleon Bonaparte" },
    { q:"The only thing we have to fear is fear itself.", by:"Franklin D. Roosevelt" },
    { q:"The lamp that guides a sailor home burns brightest in the dark.", by:"an old ship captain's log" },
    { q:"A garden grown in silence still feeds the whole village.", by:"anonymous, attrib. folk proverb" }
  ];
  var lastQuoteIdx = -1;
  function pickQuote(){
    var idx; do { idx = Math.floor(Math.random()*quotes.length); } while (idx === lastQuoteIdx && quotes.length > 1);
    lastQuoteIdx = idx; return quotes[idx];
  }

  var quoteCard = document.getElementById('quoteCard');
  var backdrop = document.getElementById('backdrop');
  var modal = document.getElementById('modal');
  var modalClose = document.getElementById('modalClose');
  var quoteText = document.getElementById('quoteText');
  var quoteBy = document.getElementById('quoteBy');
  var isOpen = false;

  function setQuote(fade){
    var q = pickQuote();
    if (fade){
      quoteText.style.opacity = 0; quoteBy.style.opacity = 0;
      setTimeout(function(){
        quoteText.textContent = '"' + q.q + '"';
        quoteBy.textContent = q.by;
        quoteText.style.opacity = 1; quoteBy.style.opacity = 1;
      }, 140);
    } else {
      quoteText.textContent = '"' + q.q + '"';
      quoteBy.textContent = q.by;
    }
  }

  function openModal(){
    setQuote(false);
    backdrop.classList.add('show');
    modal.classList.add('show');
    isOpen = true;
    modalClose.focus();
  }
  function closeModal(){
    backdrop.classList.remove('show');
    modal.classList.remove('show');
    isOpen = false;
    quoteCard.focus();
  }

  quoteCard.addEventListener('click', function(e){ e.stopPropagation(); if (!isOpen) openModal(); });
  quoteCard.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if (!isOpen) openModal(); }
  });
  modal.addEventListener('click', function(e){
    if (e.target === modalClose || modalClose.contains(e.target)) return;
    setQuote(true);
  });
  modalClose.addEventListener('click', function(e){ e.stopPropagation(); closeModal(); });
  modalClose.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); closeModal(); }
  });
  backdrop.addEventListener('click', closeModal);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && isOpen) closeModal();
  });
})();
</script>

<script>
(function(){
  var canvas = document.getElementById('dust');
  if (!canvas) return;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var particles = [];
  var px = 0, py = 0;          // pointer parallax target
  var sx = 0, sy = 0;          // smoothed parallax
  var scrollDrift = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  function makeParticle(seed){
    var r = Math.random();
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: r < 0.85 ? 0.6 + Math.random() * 1.1 : 1.6 + Math.random() * 1.4, // mostly fine dust, a few larger motes
      vx: (Math.random() - 0.5) * 0.07,
      vy: -(0.015 + Math.random() * 0.05),                                 // slow upward drift
      a: 0.15 + Math.random() * 0.4,
      tw: 0.4 + Math.random() * 1.2,   // twinkle speed
      ph: Math.random() * Math.PI * 2, // twinkle phase
      depth: 0.3 + Math.random() * 0.7 // parallax depth
    };
  }

  var COUNT = Math.min(90, Math.max(45, Math.round(window.innerWidth / 14)));
  for (var i = 0; i < COUNT; i++) particles.push(makeParticle());

  var carousel = document.getElementById('carousel');
  if (carousel){
    carousel.addEventListener('scroll', function(){
      scrollDrift = carousel.scrollLeft * 0.015;
    }, { passive:true });
  }
  window.addEventListener('pointermove', function(e){
    px = (e.clientX / W - 0.5) * 2;
    py = (e.clientY / H - 0.5) * 2;
  }, { passive:true });

  var t = 0;
  function frame(){
    t += 0.016;
    sx += (px - sx) * 0.03;
    sy += (py - sy) * 0.03;
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      if (!reduceMotion){
        p.x += p.vx + sx * 0.12 * p.depth;
        p.y += p.vy + sy * 0.08 * p.depth;
        if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
        if (p.x < -4) p.x = W + 4;
        if (p.x > W + 4) p.x = -4;
      }
      var twinkle = 0.55 + 0.45 * Math.sin(t * p.tw + p.ph);
      var alpha = p.a * twinkle;
      var ox = scrollDrift * p.depth * 0.4;

      ctx.beginPath();
      ctx.arc(p.x + ox, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(226,229,234,' + alpha.toFixed(3) + ')';
      ctx.fill();

      if (p.r > 1.6){ // soft halo on the larger motes
        ctx.beginPath();
        ctx.arc(p.x + ox, p.y, p.r * 3.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(201,205,212,' + (alpha * 0.05).toFixed(3) + ')';
        ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
