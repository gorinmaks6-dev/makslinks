<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maks Gorin — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --text:#f0eeea;
    --muted: rgba(240,238,234,0.55);
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.12);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0;
    background:#070714;
    color: var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    overflow-x:hidden;
    height:100%;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- background ---------- */
  .bg-wrap{
    position:fixed; inset:0; z-index:0;
    overflow:hidden;
  }
  .bg-wrap .bg-img{
    position:absolute; inset:0;
    background: url('assets/bg.jpg') center/cover no-repeat;
    transform: scale(1.08);
    animation: bgDrift 30s ease-in-out infinite;
  }
  @keyframes bgDrift{
    0%,100%{ transform: scale(1.08) translate(0,0); }
    50%{ transform: scale(1.12) translate(-1%,-1%); }
  }
  .bg-wrap .bg-overlay{
    position:absolute; inset:0;
    background: rgba(7,7,20,0.72);
    backdrop-filter: blur(1px);
    -webkit-backdrop-filter: blur(1px);
  }
  .bg-wrap .bg-vignette{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(7,7,20,0.9) 100%);
  }

  /* topo overlay */
  .topo-layer{
    position:absolute; inset:0;
    opacity:0.35;
    pointer-events:none;
  }
  .topo-layer svg{
    position:absolute;
    width:120%; height:120%;
    left:-10%; top:-10%;
  }
  .topo-layer .t1{ animation: topoDrift 50s linear infinite; }
  .topo-layer .t2{ animation: topoDrift 38s linear infinite reverse; opacity:0.5; }
  .topo-layer .t3{ animation: topoDrift 28s linear infinite; opacity:0.3; }
  @keyframes topoDrift{
    0%{ transform: translate(0,0); }
    50%{ transform: translate(3%,2%); }
    100%{ transform: translate(0,0); }
  }
  .pulse-dot{
    animation: pulseLight 4s ease-in-out infinite;
  }
  .pulse-dot.d2{ animation-delay:-1.3s; }
  .pulse-dot.d3{ animation-delay:-2.6s; }
  @keyframes pulseLight{
    0%,100%{ opacity:0.1; r:1.2; }
    50%{ opacity:0.8; r:2.8; }
  }

  /* ---------- layout ---------- */
  .page{ position:relative; z-index:1; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  header{ text-align:center; padding: max(48px, env(safe-area-inset-top) + 32px) 20px 8px; }

  /* Avatar */
  .avatar-wrap{
    position:relative;
    width:68px; height:68px;
    margin:0 auto 12px;
    border-radius:50%;
    padding:2.5px;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
  }
  .avatar-wrap img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center;
    display:block;
    background:#111;
  }

  header h1{ margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(24px,6.5vw,36px); letter-spacing:-0.01em; }
  header p{ margin:6px 0 0; font-size:12px; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase; }
  .hint{ text-align:center; font-size:11px; color:var(--muted); margin: 6px 0 0; letter-spacing:0.02em; }

  /* ---------- 3D carousel ---------- */
  .carousel-wrap{
    flex:1;
    display:flex;
    align-items:center;
    overflow-x:auto;
    overflow-y:visible;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    perspective:1400px;
    scrollbar-width:none;
    touch-action:pan-x;
  }
  .carousel-wrap::-webkit-scrollbar{ display:none; }
  .carousel-track{
    display:flex;
    align-items:flex-end;
    gap: 32px;
    padding: 36px calc(50% - 64px) 50px;
  }

  .book-card{
    flex-shrink:0;
    width:128px;
    scroll-snap-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--text);
    cursor:pointer;
    transform-style:preserve-3d;
    will-change: transform;
    transition: transform 0.05s linear;
    opacity:0;
    animation: cardEnter 0.7s cubic-bezier(.2,.9,.25,1) forwards;
  }
  .book-card:nth-child(1){ animation-delay:0.08s; }
  .book-card:nth-child(2){ animation-delay:0.16s; }
  .book-card:nth-child(3){ animation-delay:0.24s; }
  .book-card:nth-child(4){ animation-delay:0.32s; }

  @keyframes cardEnter{
    from{ opacity:0; transform: translateY(40px) rotateY(-20deg); }
    to{ opacity:1; transform: translateY(0) rotateY(0deg); }
  }

  /* 3D book */
  .book-3d{
    position:relative;
    width:128px;
    height:174px;
    transform-style:preserve-3d;
    transform: rotateX(8deg);
    transition: transform 0.4s cubic-bezier(.2,.9,.25,1);
  }
  .book-card:hover .book-3d, .book-card.active .book-3d{
    transform: rotateX(4deg) translateZ(30px) translateY(-8px);
  }

  /* Spine */
  .book-spine{
    position:absolute;
    inset:0;
    border-radius: 3px 2px 2px 3px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 14px 8px;
    transform: translateZ(10px);
    box-shadow:
      0 20px 40px rgba(0,0,0,0.55),
      0 6px 12px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .book-spine::before{
    content:'';
    position:absolute;
    left:0; top:0; bottom:0; width:3px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px 0 0 3px;
  }
  .book-spine::after{
    content:'';
    position:absolute;
    right:0; top:0; bottom:0; width:2px;
    background: rgba(0,0,0,0.25);
  }

  .spine-shine{
    position:absolute;
    top:0; left:-60%; width:60%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: skewX(-18deg);
    transition: left 0.7s ease;
  }
  .book-card:hover .spine-shine, .book-card.active .spine-shine{
    left:130%;
  }

  .spine-icon{ font-size:26px; position:relative; z-index:1; }
  .spine-icon-img{
    width:40px; height:40px;
    object-fit:contain;
    object-position:center;
    position:relative;
    z-index:1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    display:block;
  }
  .spine-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.02em;
    position:relative;
    z-index:1;
    text-align:center;
  }

  /* Colors */
  .book-spine.janus{
    background: linear-gradient(160deg, #f0ede5 0%, #e0dbd0 50%, #d4cfc2 100%);
    color: #1a1a1a;
  }
  .book-spine.youtube{
    background: linear-gradient(160deg, #ff4444 0%, #cc0000 50%, #8a0000 100%);
    color: #fff;
  }
  .book-spine.tiktok{
    background: linear-gradient(160deg, #1a1a1a 0%, #0c0c0c 50%, #000 100%);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .book-spine.tiktok .spine-icon{
    background: linear-gradient(135deg,#25f4ee,#fe2c55);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .book-spine.quotes{
    background: linear-gradient(160deg, #2a2350 0%, #1a1535 50%, #0f0c22 100%);
    color: #d8b466;
    border: 1px solid rgba(216,180,102,0.18);
  }

  /* Pages right */
  .book-pages-right{
    position:absolute;
    right: -8px;
    top: 2px;
    bottom: 2px;
    width: 10px;
    background: repeating-linear-gradient(
      180deg,
      rgba(235,230,215,0.9) 0px,
      rgba(235,230,215,0.9) 1px,
      rgba(195,185,165,0.6) 1px,
      rgba(195,185,165,0.6) 3px
    );
    transform: rotateY(28deg) translateZ(-2px);
    border-radius: 0 2px 2px 0;
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.2);
  }
  .book-pages-right::before{
    content:'';
    position:absolute;
    right:0; top:0; bottom:0; width:1px;
    background: rgba(0,0,0,0.25);
  }

  /* Pages top */
  .book-pages-top{
    position:absolute;
    top: -6px;
    left: 3px;
    right: 3px;
    height: 7px;
    background: repeating-linear-gradient(
      90deg,
      rgba(235,230,215,0.85) 0px,
      rgba(235,230,215,0.85) 1px,
      rgba(195,185,165,0.5) 1px,
      rgba(195,185,165,0.5) 3px
    );
    transform: rotateX(-55deg) translateZ(-1px);
    border-radius: 2px 2px 0 0;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.15);
  }

  /* Shadow */
  .book-shadow{
    position:absolute;
    bottom: -16px;
    left: 8%;
    right: 8%;
    height: 12px;
    background: rgba(0,0,0,0.45);
    border-radius: 50%;
    filter: blur(10px);
    transform: translateZ(-25px);
    transition: all 0.4s ease;
  }
  .book-card:hover .book-shadow, .book-card.active .book-shadow{
    bottom: -22px;
    left: 2%;
    right: 2%;
    background: rgba(0,0,0,0.6);
    filter: blur(14px);
  }

  /* Label */
  .label{ text-align:center; transition: opacity 0.2s linear; }
  .label .t{ font-size:13px; font-weight:600; display:block; }
  .label .s{ font-size:10.5px; color:var(--muted); display:block; margin-top:2px; }

  /* ---------- modal ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(2,2,8,0.78);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity:0; pointer-events:none; transition: opacity 0.4s ease;
    z-index:9;
  }
  .backdrop.show{ opacity:1; pointer-events:auto; }

  .open-book{
    position:fixed;
    background:linear-gradient(160deg,#1e1840,#0d0a1f);
    border-radius:14px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
    z-index:10;
    display:none;
    overflow:hidden;
  }
  .open-book.visible{ display:block; }
  .open-book.animating{ transition: transform 0.55s cubic-bezier(.2,.9,.25,1); }

  .book-close{
    position:absolute; top:14px; right:14px;
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer; opacity:0; transition: opacity 0.3s ease 0.3s, background 0.2s ease;
    z-index:5;
  }
  .book-close:hover{ background:rgba(255,255,255,0.2); }
  .open-book.opened .book-close{ opacity:1; }

  .page-inner{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 40px 28px;
    text-align:center;
    opacity:0;
    transform: rotateY(0deg);
    transform-origin: left center;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .open-book.opened .page-inner{ opacity:1; }
  .page-inner.turning{ transform: rotateY(-92deg); opacity:0.2; }

  .page-inner i.quill{ color:#d8b466; font-size:17px; opacity:0.85; margin-bottom:18px; }
  .quote-text{ font-family:'Fraunces',serif; font-style:italic; font-size:18px; line-height:1.6; color:var(--text); }
  .quote-by{ margin-top:16px; font-size:11px; letter-spacing:0.04em; color:var(--muted); text-transform:uppercase; }
  .quote-tap{ margin-top:24px; font-size:10px; letter-spacing:0.06em; color:var(--muted); text-transform:uppercase; display:flex; align-items:center; gap:6px; }

  /* ---------- responsive ---------- */
  @media (min-width: 400px){
    .book-card{ width:138px; gap:14px; }
    .book-3d{ width:138px; height:188px; }
    .book-spine{ gap:10px; padding: 16px 10px; }
    .spine-icon{ font-size:28px; }
    .spine-icon-img{ width:44px; height:44px; }
    .spine-title{ font-size:14px; }
    .book-pages-right{ width:12px; right:-9px; }
    .book-pages-top{ height:8px; top:-7px; }
    .book-shadow{ bottom:-18px; height:14px; }
    .carousel-track{ gap:38px; padding: 40px calc(50% - 69px) 55px; }
    .avatar-wrap{ width:72px; height:72px; }
    .label .t{ font-size:14px; }
    .label .s{ font-size:11px; }
    .quote-text{ font-size:20px; }
    .page-inner{ padding:44px 32px; }
  }

  @media (min-width: 768px){
    .book-card{ width:150px; }
    .book-3d{ width:150px; height:204px; }
    .carousel-track{ gap:44px; padding: 50px calc(50% - 75px) 70px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
    .book-card{ opacity:1; animation:none; }
    .bg-wrap .bg-img{ animation:none; }
    .topo-layer .t1, .topo-layer .t2, .topo-layer .t3{ animation:none; }
    .pulse-dot{ animation:none; opacity:0.5; }
  }
</style>

<script>
(function(){
  var carousel = document.getElementById('carousel');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.book-card'));
  var ticking = false;

  function updateCoverflow(){
    var rect = carousel.getBoundingClientRect();
    var centerX = rect.left + rect.width/2;
    cards.forEach(function(card){
      var cRect = card.getBoundingClientRect();
      var cCenter = cRect.left + cRect.width/2;
      var delta = (cCenter - centerX) / (rect.width/2);
      var clamped = Math.max(-1.3, Math.min(1.3, delta));
      var rotateY = -clamped*32;
      var rotateX = 8 - Math.abs(clamped)*3;
      var scale = 1 - Math.min(Math.abs(clamped),1)*0.22;
      var bright = 1 - Math.min(Math.abs(clamped),1)*0.45;
      var z = (1 - Math.abs(clamped)) * 50;
      card.style.transform = 'rotateY('+rotateY+'deg) rotateX('+rotateX+'deg) scale('+scale+') translateZ('+z+'px)';
      card.style.zIndex = Math.round((1-Math.abs(clamped))*100);
      card.querySelector('.book-spine').style.filter = 'brightness('+bright+')';
      card.querySelector('.label').style.opacity = 1 - Math.min(Math.abs(clamped),1)*0.7;
      if (Math.abs(clamped) < 0.15) {
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
    });
    ticking = false;
  }
  function onScroll(){
    if (!ticking){ requestAnimationFrame(updateCoverflow); ticking = true; }
  }
  carousel.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', updateCoverflow);
  updateCoverflow();

  // app-first redirect
  var isAndroid = /android/i.test(navigator.userAgent);
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  cards.filter(function(c){ return c.dataset.type==='link'; }).forEach(function(row){
    row.addEventListener('click', function(e){
      var webUrl = row.getAttribute('data-web');
      var iosScheme = row.getAttribute('data-ios');
      var androidPkg = row.getAttribute('data-android-package');
      if (!iosScheme && !androidPkg){ return; }
      e.preventDefault();
      if (isAndroid && androidPkg){
        var bare = webUrl.replace(/^https?:\/\//,'');
        window.location.href = 'intent://'+bare+'#Intent;scheme=https;package='+androidPkg+';S.browser_fallback_url='+encodeURIComponent(webUrl)+';end';
        return;
      }
      if (isIOS && iosScheme){
        var didHide=false;
        var onHide=function(){ didHide=true; };
        document.addEventListener('visibilitychange', onHide, { once:true });
        window.location.href = iosScheme;
        setTimeout(function(){
          document.removeEventListener('visibilitychange', onHide);
          if (!didHide){ window.location.href = webUrl; }
        }, 900);
        return;
      }
      window.location.href = webUrl;
    });
  });

  // quotes
  var quotes = [
    { q:"You have power over your mind, not outside events.", by:"Marcus Aurelius" },
    { q:"Waste no more time arguing what a good man should be. Be one.", by:"Marcus Aurelius" },
    { q:"It is not that we have a short time to live, but that we waste a lot of it.", by:"Seneca" },
    { q:"It's not what happens to you, but how you react that matters.", by:"Epictetus" },
    { q:"Our greatest glory is not in never falling, but in rising every time we fall.", by:"Confucius" },
    { q:"The man who moves a mountain begins by carrying away small stones.", by:"Confucius" },
    { q:"A journey of a thousand miles begins with a single step.", by:"Lao Tzu" },
    { q:"In the midst of chaos, there is also opportunity.", by:"Sun Tzu" },
    { q:"Whatever you are, be a good one.", by:"Abraham Lincoln" },
    { q:"By failing to prepare, you are preparing to fail.", by:"Benjamin Franklin" },
    { q:"Well done is better than well said.", by:"Benjamin Franklin" },
    { q:"Knowing yourself is the beginning of all wisdom.", by:"Aristotle" },
    { q:"The only true wisdom is in knowing you know nothing.", by:"Socrates" },
    { q:"Simplicity is the ultimate sophistication.", by:"Leonardo da Vinci" },
    { q:"Know thyself.", by:"Ancient Greek maxim" },
    { q:"This too shall pass.", by:"Traditional proverb" },
    { q:"Carpe diem.", by:"Horace" },
    { q:"Fortune favors the bold.", by:"Virgil" },
    { q:"Knowledge is power.", by:"Francis Bacon" },
    { q:"Imagination rules the world.", by:"Napoleon Bonaparte" },
    { q:"The only thing we have to fear is fear itself.", by:"Franklin D. Roosevelt" },
    { q:"The lamp that guides a sailor home burns brightest in the dark.", by:"an old ship captain's log" },
    { q:"A garden grown in silence still feeds the whole village.", by:"anonymous, attrib. folk proverb" }
  ];
  var lastIndex = -1;
  function pickQuote(){
    var idx; do { idx = Math.floor(Math.random()*quotes.length); } while (idx===lastIndex && quotes.length>1);
    lastIndex = idx; return quotes[idx];
  }

  var quoteBook = document.getElementById('quoteBook');
  var backdrop = document.getElementById('backdrop');
  var openBook = document.getElementById('openBook');
  var pageInner = document.getElementById('pageInner');
  var quoteText = document.getElementById('quoteText');
  var quoteBy = document.getElementById('quoteBy');
  var bookClose = document.getElementById('bookClose');
  var isOpen = false;

  function setQuoteContent(){
    var q = pickQuote();
    quoteText.textContent = '"' + q.q + '"';
    quoteBy.textContent = q.by;
  }

  function openTheBook(){
    var startRect = quoteBook.querySelector('.book-3d').getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var targetW = Math.min(340, vw*0.88);
    var targetH = Math.min(460, vh*0.72);
    var targetLeft = (vw - targetW)/2;
    var targetTop = (vh - targetH)/2;

    openBook.style.left = targetLeft+'px';
    openBook.style.top = targetTop+'px';
    openBook.style.width = targetW+'px';
    openBook.style.height = targetH+'px';
    openBook.classList.add('visible');
    openBook.classList.remove('opened');

    var dx = (startRect.left + startRect.width/2) - (targetLeft + targetW/2);
    var dy = (startRect.top + startRect.height/2) - (targetTop + targetH/2);
    var sx = startRect.width / targetW;
    var sy = startRect.height / targetH;

    openBook.style.transform = 'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')';
    openBook.offsetHeight;

    backdrop.classList.add('show');
    requestAnimationFrame(function(){
      openBook.classList.add('animating');
      openBook.style.transform = 'none';
    });

    setQuoteContent();

    var settled = false;
    function markOpened(){
      if (settled) return;
      settled = true;
      openBook.removeEventListener('transitionend', onEnd);
      openBook.classList.add('opened');
      isOpen = true;
    }
    var onEnd = function(e){
      if (e.target !== openBook || e.propertyName !== 'transform') return;
      markOpened();
    };
    openBook.addEventListener('transitionend', onEnd);
    setTimeout(markOpened, 650);
  }

  function closeTheBook(){
    var startRect = quoteBook.querySelector('.book-3d').getBoundingClientRect();
    var currentRect = openBook.getBoundingClientRect();
    var dx = (startRect.left + startRect.width/2) - (currentRect.left + currentRect.width/2);
    var dy = (startRect.top + startRect.height/2) - (currentRect.top + currentRect.height/2);
    var sx = startRect.width / currentRect.width;
    var sy = startRect.height / currentRect.height;

    openBook.classList.remove('opened');
    backdrop.classList.remove('show');
    openBook.style.transform = 'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')';

    var settled = false;
    function markClosed(){
      if (settled) return;
      settled = true;
      openBook.removeEventListener('transitionend', onEnd);
      openBook.classList.remove('visible', 'animating');
      openBook.style.transform = 'none';
      isOpen = false;
    }
    var onEnd = function(e){
      if (e.target !== openBook || e.propertyName !== 'transform') return;
      markClosed();
    };
    openBook.addEventListener('transitionend', onEnd);
    setTimeout(markClosed, 650);
  }

  function turnPage(){
    pageInner.classList.add('turning');
    setTimeout(function(){
      setQuoteContent();
      pageInner.classList.remove('turning');
    }, 190);
  }

  quoteBook.addEventListener('click', function(e){
    e.stopPropagation();
    if (!isOpen){ openTheBook(); }
  });
  openBook.addEventListener('click', function(e){
    if (e.target === bookClose || bookClose.contains(e.target)) return;
    if (isOpen){ turnPage(); }
  });
  bookClose.addEventListener('click', function(e){
    e.stopPropagation();
    closeTheBook();
  });
  backdrop.addEventListener('click', function(){
    if (isOpen){ closeTheBook(); }
  });
})();
</script>
